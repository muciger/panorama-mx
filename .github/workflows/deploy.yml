name: Panorama MX — Build & Deploy

# Arquitectura skip-bie permanente:
# El workflow NO descarga BIE en cloud. La API INEGI parece geo-bloquear IPs
# no mexicanas y devuelve responses parciales/vacías sin error 4xx.
# Los datos se actualizan localmente desde Mac y se commitean a main.
# El workflow solo regenera el HTML y deploya a gh-pages.

on:
  workflow_dispatch:  # permite disparar manualmente desde GitHub Actions
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'assets/**'
      - 'scripts/**'
      - 'config/**'
      - 'data/**'         # nuevo: redeploy cuando llegan datos frescos del Mac
      - '.github/workflows/deploy.yml'

permissions:
  contents: write   # necesario para push a gh-pages

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # necesario para sanity check (comparar HEAD~1 vs HEAD)

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity check de data/ (defensa anti-borrado)
        run: |
          # Compara nº de registros (no líneas: el reformateo cambiaría wc -l) vs
          # HEAD~1, y aborta si algún data/*.json desapareció o perdió >50%.
          # Defensa en profundidad: la guarda primaria está en bie/ingest.py.
          set -euo pipefail
          if ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "ERROR: no existe HEAD~1 (fetch-depth insuficiente, debe ser >=2)."
            exit 1
          fi
          python3 scripts/ci_sanity_check.py HEAD~1

      - name: Regenerar sitio HTML (sin BIE refresh)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # --skip-bie --skip-interp --skip-calendar: cloud no toca esos datos.
          # Solo corre composites + build + validate sobre los data/ del repo.
          python3 scripts/refresh_daily.py --skip-bie --skip-interp --skip-calendar

      - name: Verificar que site/ fue generado
        run: |
          if [ ! -f site/index.html ]; then
            echo "ERROR: site/index.html no existe. El build falló."
            exit 1
          fi
          n_html=$(find site -name '*.html' | wc -l)
          echo "OK — $n_html páginas HTML generadas"
          if [ "$n_html" -lt 30 ]; then
            echo "ERROR: Esperaba al menos 30 páginas HTML, encontré $n_html"
            exit 1
          fi

      - name: Deploy a GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          commit_message: "deploy: ${{ github.run_number }} · ${{ github.event_name }}"
          # force_orphan:false conserva el historial de gh-pages para poder
          # hacer rollback a un deploy bueno si uno malo llegara a pasar.
          force_orphan: false

      - name: Resumen del run
        if: always()
        run: |
          echo "## Resumen del deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Run number: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [ -f site/index.html ]; then
            echo "- Páginas HTML: $(find site -name '*.html' | wc -l)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Nota: este workflow no descarga datos del BIE. Los datos se actualizan localmente desde Mac y se commitean a main." >> $GITHUB_STEP_SUMMARY
